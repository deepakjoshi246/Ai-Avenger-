services:
  - type: web
    name: ai-protector
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEBIUS_API_KEY
        sync: false          # Set this in the Render dashboard — never commit the value
      - key: NEMOTRON_MODEL
        value: nvidia/Llama-3.1-Nemotron-70B-Instruct
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
